[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-rag-ingestion"
version = "0.1.0"
description = "MSMARCO-XI ingestion layer for the HH Goa 2026 Voice RAG project"
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.0.0",
  "qdrant-client>=1.12.0",
  "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
