[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-rag-ingestion"
version = "0.1.0"
description = "MSMARCO-XI ingestion layer for the HH Goa 2026 Voice RAG project"
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.0.0",
  "pyarrow>=14.0.0",
  "qdrant-client>=1.12.0",
  "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
app = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]
providers = [
  "groq>=0.11",
  "google-genai>=1.0",
  "sarvamai>=0.1",
  "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "backend"]
testpaths = ["tests"]
addopts = "-q"
